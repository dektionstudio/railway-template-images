global:
  scrape_interval: 30s
  evaluation_interval: 30s
otlp:
  # keep OpenTelemetry resource attributes such as service.name as labels
  promote_resource_attributes: ["service.name", "service.namespace", "service.instance.id", "deployment.environment"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
