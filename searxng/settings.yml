# Private SearXNG for AI tools. Everything not listed here keeps SearXNG's defaults.
use_default_settings:
  engines:
    # From Railway's datacenter IPs (tested 2026-09-26) Google, Bing and Yahoo answer; DuckDuckGo shows a
    # CAPTCHA and Brave, Startpage, Qwant and Mojeek return nothing. Keeping only engines that work avoids a
    # timeout on every search.
    keep_only:
      - google
      - bing
      - yahoo
      - wikipedia
      - wikidata
      - google news
      - bing news
      - yahoo news
      - github
      - stackoverflow
      - arxiv
      - pypi
      - npm
      - mdn

server:
  # server.secret_key comes from the SEARXNG_SECRET variable
  limiter: false
  public_instance: false
  image_proxy: false

search:
  formats:
    - html
    - json

# Enabled explicitly: some of these are off in SearXNG's default selection, which left Yahoo as the only
# engine answering a normal search (tested 2026-09-27: Google and Bing return 10 results each when on).
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: google news
    disabled: false
  - name: bing news
    disabled: false
  - name: yahoo news
    disabled: false
